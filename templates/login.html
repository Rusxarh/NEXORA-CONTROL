<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión · NEXORA</title>
  {% include "_estilos.html" %}
  <script>
    (function () {
      try {
        var guardado = localStorage.getItem("nexora-theme");
        if (guardado === "light" || guardado === "dark") {
          document.documentElement.setAttribute("data-theme", guardado);
        }
      } catch (e) { /* sin efecto: se queda en claro por defecto */ }
    })();
  </script>
</head>
<body class="h-full bg-zinc-950 text-zinc-100 antialiased">
  <button
    type="button"
    onclick="alternarTema()"
    data-rol="toggle-tema"
    aria-label="Cambiar tema claro/oscuro"
    class="btn-secondary btn-sm"
    style="position:fixed; top:1rem; right:1rem; z-index:10;"
  >🌙 Oscuro</button>

  <div class="min-h-full flex items-center justify-center px-4 py-10">
    <div class="w-full max-w-sm">

      <div class="flex flex-col items-center mb-6">
        <span class="inline-flex h-12 w-12 items-center justify-center rounded-xl bg-brand-600 text-white font-bold text-lg mb-3">NX</span>
        <h1 class="text-lg font-semibold text-zinc-100">NEXORA</h1>
        <p class="text-xs text-zinc-500 mt-0.5">Dashboard Admin · Inicia sesión para continuar</p>
      </div>

      <div class="card">
        {% if mensaje %}
        <div class="mb-4 text-xs {{ 'alert-success' if tipo_mensaje == 'exito' else ('alert-error' if tipo_mensaje == 'error' else 'alert-info') }}">
          {{ mensaje }}
        </div>
        {% endif %}

        <form method="post" action="/login" class="space-y-4">
          <input type="hidden" name="siguiente" value="{{ siguiente }}">

          <div>
            <label class="label-field">Usuario</label>
            <input
              name="username" type="text" required autofocus autocomplete="username"
              class="input-field"
            >
          </div>

          <div>
            <label class="label-field">Contraseña</label>
            <input
              name="password" type="password" required autocomplete="current-password"
              class="input-field"
            >
          </div>

          <button type="submit" class="btn-primary w-full">
            Iniciar sesión
          </button>
        </form>
      </div>

      <p class="text-center text-[11px] text-zinc-600 mt-4">NEXORA · Uso interno</p>
    </div>
  </div>

  <script>
    function obtenerTemaActual() {
      return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
    }
    function actualizarBotonesTema() {
      var esOscuro = obtenerTemaActual() === 'dark';
      document.querySelectorAll('[data-rol="toggle-tema"]').forEach(function (btn) {
        btn.textContent = esOscuro ? '☀️ Claro' : '🌙 Oscuro';
      });
    }
    function aplicarTema(tema) {
      document.documentElement.setAttribute('data-theme', tema);
      try { localStorage.setItem('nexora-theme', tema); } catch (e) { /* sin efecto */ }
      actualizarBotonesTema();
    }
    function alternarTema() {
      aplicarTema(obtenerTemaActual() === 'dark' ? 'light' : 'dark');
    }
    actualizarBotonesTema();
  </script>
</body>
</html>
